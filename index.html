<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POG ドラフト発表ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Pinterest DESIGN.md tokens ── */
  :root {
    --primary: #e60023;
    --primary-pressed: #cc001f;
    --ink: #000000;
    --ink-soft: #211922;
    --body: #33332e;
    --mute: #62625b;
    --ash: #91918c;
    --stone: #c8c8c1;
    --hairline: #dadad3;
    --hairline-soft: #e5e5e0;
    --canvas: #ffffff;
    --surface-soft: #fbfbf9;
    --surface-card: #f6f6f3;
    --secondary-bg: #e5e5e0;
    --success-deep: #103c25;
    --success-pale: #c7f0da;
    --error: #9e0a0a;
    --r-sm: 8px;
    --r-md: 16px;
    --r-lg: 32px;
    --r-full: 9999px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--surface-soft);
    color: var(--body);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.4;
  }

  /* ── NAV ── */
  header {
    background: var(--canvas);
    border-bottom: 1px solid var(--hairline);
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-icon {
    width: 32px;
    height: 32px;
    background: var(--primary);
    border-radius: var(--r-full);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 700;
    font-size: 18px;
    flex-shrink: 0;
  }
  .logo-text {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.5px;
  }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .save-badge {
    font-size: 12px;
    color: var(--success-deep);
    background: var(--success-pale);
    border-radius: var(--r-full);
    padding: 4px 12px;
    opacity: 0;
    transition: opacity 0.4s;
    font-weight: 600;
  }
  .save-badge.show { opacity: 1; }

  /* ── BUTTONS ── */
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    border: none;
    border-radius: var(--r-full);
    padding: 10px 20px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
    line-height: 1;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-pressed); }
  .btn-secondary { background: var(--secondary-bg); color: var(--ink); }
  .btn-secondary:hover { background: var(--stone); }
  .btn-ghost { background: transparent; color: var(--ink); border: 2px solid var(--hairline); }
  .btn-ghost:hover { background: var(--surface-card); }
  .btn-success { background: var(--success-deep); color: #fff; }
  .btn-success:hover { background: #1a5c39; }
  .btn-danger { background: transparent; color: var(--error); border: 2px solid var(--hairline); }
  .btn-danger:hover { background: #fce8e8; border-color: var(--error); }

  /* ── INPUTS ── */
  input[type="number"], input[type="text"] {
    background: var(--canvas);
    border: 1px solid var(--ash);
    border-radius: var(--r-md);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    padding: 11px 15px;
    width: 100%;
    outline: none;
    transition: border 0.15s, box-shadow 0.15s;
    height: 44px;
  }
  input:focus {
    border: 2px solid var(--ink);
    box-shadow: 0 0 0 4px rgba(67,94,229,0.25);
  }

  /* ── SETUP ── */
  #setup { max-width: 560px; margin: 40px auto; padding: 0 20px; }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--mute);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .card-box {
    background: var(--canvas);
    border-radius: var(--r-lg);
    padding: 24px;
    margin-bottom: 16px;
    border: 1px solid var(--hairline-soft);
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--mute); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

  .add-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .add-row input { flex: 1; border-radius: var(--r-full); }
  .add-row button { border-radius: var(--r-full); }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; min-height: 32px; }
  .tag {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface-card);
    border: 1px solid var(--hairline);
    border-radius: var(--r-full);
    padding: 5px 6px 5px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }
  .tag-x {
    background: var(--secondary-bg); border: none; color: var(--mute);
    font-size: 13px; line-height: 1; cursor: pointer;
    width: 22px; height: 22px; border-radius: var(--r-full);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
  }
  .tag-x:hover { background: var(--stone); color: var(--ink); transform: none; }

  #setup-start-btn { width: 100%; padding: 14px; font-size: 15px; border-radius: var(--r-full); }

  .resume-box {
    background: var(--canvas);
    border: 2px solid var(--primary);
    border-radius: var(--r-lg);
    padding: 20px 24px;
    margin-bottom: 16px;
    display: none;
  }
  .resume-box p { font-size: 13px; color: var(--mute); margin-bottom: 12px; }
  .resume-box strong { color: var(--primary); }
  .resume-btns { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ── COMMON SCREEN ── */
  #register, #draft { display: none; padding: 20px; }

  .toolbar {
    background: var(--canvas);
    border: 1px solid var(--hairline-soft);
    border-radius: var(--r-lg);
    padding: 14px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .toolbar-sep { flex: 1; }

  .reg-progress { font-size: 13px; color: var(--mute); font-weight: 600; }
  .reg-progress b { color: var(--primary); }

  /* ── STATS ── */
  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat {
    background: var(--surface-card);
    border: 1px solid var(--hairline);
    border-radius: var(--r-full);
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--mute);
  }
  .stat b { color: var(--ink); }
  .stat.ok-stat b { color: var(--success-deep); }
  .stat.dup-stat b { color: var(--error); }

  .legend {
    display: flex; gap: 16px; font-size: 12px;
    color: var(--mute); margin-bottom: 14px;
    flex-wrap: wrap; padding: 0 4px;
    font-weight: 600;
  }

  /* ── TABLE ── */
  .table-wrap {
    overflow: auto;
    border: 1px solid var(--hairline);
    border-radius: var(--r-lg);
    max-height: calc(100vh - 250px);
    background: var(--canvas);
  }
  table { border-collapse: collapse; min-width: 100%; }

  thead th {
    background: var(--surface-card);
    position: sticky; top: 0; z-index: 3;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase;
    color: var(--mute);
    padding: 12px 8px;
    border-right: 1px solid var(--hairline-soft);
    border-bottom: 1px solid var(--hairline);
    white-space: nowrap;
    text-align: center;
  }
  thead th:first-child { left: 0; z-index: 4; min-width: 52px; }

  tbody td {
    padding: 5px 6px;
    border-right: 1px solid var(--hairline-soft);
    border-bottom: 1px solid var(--hairline-soft);
    text-align: center;
    vertical-align: middle;
  }
  tbody td:first-child {
    position: sticky; left: 0; z-index: 1;
    background: var(--surface-card);
    font-size: 11px; color: var(--mute); font-weight: 700;
    border-right: 1px solid var(--hairline);
    padding: 5px 8px; min-width: 52px;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--surface-soft); }
  tbody tr:hover td:first-child { background: var(--surface-card); }

  /* ドラッグ列並び替え */
  thead th.draggable { cursor: grab; user-select: none; }
  thead th.draggable:active { cursor: grabbing; }
  thead th.drag-over { background: #fce8e8 !important; color: var(--primary); border-bottom: 3px solid var(--primary); }
  thead th.dragging { opacity: 0.35; }
  .th-inner { display: flex; align-items: center; justify-content: center; gap: 4px; }
  .drag-grip { font-size: 12px; color: var(--stone); }

  /* ── REG INPUT ── */
  .reg-input {
    width: 100%; min-width: 80px; max-width: 130px;
    background: var(--surface-soft);
    border: 1px solid var(--hairline);
    border-radius: var(--r-md);
    color: var(--ink);
    font-family: inherit; font-size: 12px; font-weight: 600;
    padding: 7px 8px;
    outline: none; text-align: center;
    transition: border 0.15s, box-shadow 0.15s;
    display: block; margin: auto; height: auto;
  }
  .reg-input:focus {
    border: 2px solid var(--ink);
    box-shadow: 0 0 0 3px rgba(67,94,229,0.2);
    background: var(--canvas);
  }
  .reg-input.filled {
    border-color: var(--success-deep);
    color: var(--success-deep);
    background: var(--success-pale);
  }

  /* ── DRAFT CARD ── */
  .card {
    min-width: 88px; max-width: 128px; width: 100%;
    min-height: 52px;
    border-radius: var(--r-md);
    border: 1px solid var(--hairline);
    background: var(--surface-card);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: var(--ash);
    transition: background 0.12s, transform 0.1s, box-shadow 0.12s;
    padding: 6px; word-break: break-all;
    line-height: 1.4; text-align: center; margin: auto;
    user-select: none;
  }
  .card:hover:not(.revealed):not(.empty) {
    background: var(--secondary-bg);
    border-color: var(--stone);
    transform: scale(1.04);
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .card.revealed { cursor: default; font-size: 12px; }
  .card.empty { opacity: 0.3; cursor: default; font-size: 16px; }
  .card.ok {
    background: var(--success-pale);
    border-color: #6cc49a;
    color: var(--success-deep);
    font-weight: 700;
  }
  .card.dup {
    background: #fce8e8;
    border-color: #e8a0a0;
    color: var(--error);
    font-weight: 700;
  }
  .card-mark { font-size: 14px; display: block; }
  .card-name { font-size: 11px; display: block; margin-top: 2px; font-weight: 700; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">P</div>
    <span class="logo-text">POG Draft</span>
  </div>
  <div class="header-right">
    <span class="save-badge" id="save-badge">✓ 保存しました</span>
  </div>
</header>

<!-- STEP 1 -->
<div id="setup">
  <div class="resume-box" id="resume-box">
    <p>前回の途中データが見つかりました。<br><strong id="resume-info"></strong></p>
    <div class="resume-btns">
      <button class="btn-primary" onclick="resumeSession()">続きから再開する</button>
      <button class="btn-ghost" onclick="clearSaved()">新しくはじめる</button>
    </div>
  </div>
  <div class="card-box">
    <div class="section-label">基本設定</div>
    <div class="row2">
      <div class="field"><label>参加者数上限</label><input type="number" id="max-p" value="15" min="2" max="15"></div>
      <div class="field"><label>指名馬数（1人あたり）</label><input type="number" id="max-h" value="15" min="1" max="15"></div>
    </div>
    <div class="section-label">参加者</div>
    <div class="add-row">
      <input type="text" id="p-input" placeholder="参加者名を入力..." maxlength="20">
      <button class="btn-secondary" id="add-p-btn">追加</button>
    </div>
    <div class="tags" id="tags"></div>
  </div>
  <button class="btn-primary" id="setup-start-btn" disabled>馬名登録へ →</button>
</div>

<!-- STEP 2 -->
<div id="register">
  <div class="toolbar">
    <span class="reg-progress">入力済み：<b id="reg-count">0</b> / <span id="reg-total">0</span></span>
    <div class="toolbar-sep"></div>
    <button class="btn-ghost" onclick="backToSetup()">← 参加者設定</button>
    <button class="btn-success" id="draft-start-btn" disabled>ドラフト開始 →</button>
  </div>
  <div class="table-wrap"><table id="reg-table"></table></div>
</div>

<!-- STEP 3 -->
<div id="draft">
  <div class="toolbar">
    <div class="stats" id="stats"></div>
    <div class="toolbar-sep"></div>
    <button class="btn-secondary" id="save-img-btn" onclick="saveImage()">📷 画像で保存</button>
    <button class="btn-ghost" onclick="backToRegister()">← 馬名登録</button>
    <button class="btn-danger" onclick="resetAll()">やり直す</button>
  </div>
  <div class="legend">
    <span>🎯 当選（他に指名なし）</span>
    <span>😇 ハズレ（すでに指名済み）</span>
    <span>🂠 クリックでめくる</span>
  </div>
  <div class="table-wrap"><table id="draft-table"></table></div>
</div>

<script>
const STORAGE_KEY = 'pog_draft_v1';
let participants = [], maxH = 15, draftData = {}, revealedHorses = {}, revealedSet = {}, currentStep = 'setup';

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ participants, maxH, draftData, revealedHorses, revealedSet, currentStep }));
    const b = document.getElementById('save-badge');
    b.classList.add('show');
    setTimeout(() => b.classList.remove('show'), 1800);
  } catch(e) {}
}
function loadState() { try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : null; } catch(e) { return null; } }
function clearSaved() { try { localStorage.removeItem(STORAGE_KEY); } catch(e) {} document.getElementById('resume-box').style.display = 'none'; }

window.addEventListener('load', () => {
  const s = loadState();
  if (s && s.participants && s.participants.length > 0) {
    const names = { setup: '参加者設定', register: '馬名登録中', draft: 'ドラフト発表中' };
    document.getElementById('resume-info').textContent = `参加者 ${s.participants.length}人 / ${s.maxH}頭 / ${names[s.currentStep] || ''}`;
    document.getElementById('resume-box').style.display = 'block';
  }
});

function resumeSession() {
  const s = loadState(); if (!s) return;
  participants = s.participants; maxH = s.maxH; draftData = s.draftData;
  revealedHorses = s.revealedHorses || {}; revealedSet = s.revealedSet || {}; currentStep = s.currentStep;
  document.getElementById('max-p').value = participants.length;
  document.getElementById('max-h').value = maxH;
  renderTags();
  if (currentStep === 'draft') showDraft(); else showRegister();
}

// STEP1
const pInput = document.getElementById('p-input');
const tagsEl = document.getElementById('tags');
const setupStartBtn = document.getElementById('setup-start-btn');

function renderTags() {
  tagsEl.innerHTML = '';
  participants.forEach((p, i) => {
    const t = document.createElement('div'); t.className = 'tag';
    t.innerHTML = `<span>${p}</span><button class="tag-x" onclick="removeP(${i})">×</button>`;
    tagsEl.appendChild(t);
  });
  setupStartBtn.disabled = participants.length < 2;
}
function removeP(i) { participants.splice(i, 1); renderTags(); }

document.getElementById('add-p-btn').addEventListener('click', () => {
  const v = pInput.value.trim();
  const maxP = parseInt(document.getElementById('max-p').value) || 15;
  if (!v) return;
  if (participants.length >= maxP) { alert(`参加者は${maxP}人までです`); return; }
  if (participants.includes(v)) { alert('同じ名前の参加者が既にいます'); return; }
  participants.push(v); pInput.value = ''; renderTags();
});
pInput.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('add-p-btn').click(); });

setupStartBtn.addEventListener('click', () => {
  maxH = parseInt(document.getElementById('max-h').value) || 15;
  draftData = {};
  participants.forEach(p => { draftData[p] = Array(maxH).fill(''); });
  showRegister();
});

function backToSetup() {
  currentStep = 'setup'; saveState();
  document.getElementById('register').style.display = 'none';
  document.getElementById('setup').style.display = 'block';
}

// STEP2
function showRegister() {
  currentStep = 'register';
  document.getElementById('setup').style.display = 'none';
  document.getElementById('draft').style.display = 'none';
  document.getElementById('register').style.display = 'block';
  buildRegTable(); updateRegProgress(); saveState();
}

function buildRegTable() {
  const table = document.getElementById('reg-table'); table.innerHTML = '';
  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  const th0 = document.createElement('th'); th0.textContent = '順位'; hr.appendChild(th0);

  participants.forEach((p, colIdx) => {
    const th = document.createElement('th');
    th.className = 'draggable';
    th.draggable = true;
    th.dataset.col = colIdx;
    th.innerHTML = `<span class="th-inner"><span class="drag-grip">⠿</span>${p}</span>`;

    th.addEventListener('dragstart', e => {
      dragSrcCol = colIdx;
      e.dataTransfer.effectAllowed = 'move';
      th.classList.add('dragging');
    });
    th.addEventListener('dragend', () => {
      document.querySelectorAll('thead th').forEach(t => t.classList.remove('dragging', 'drag-over'));
    });
    th.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('thead th.drag-over').forEach(t => t.classList.remove('drag-over'));
      th.classList.add('drag-over');
    });
    th.addEventListener('dragleave', () => th.classList.remove('drag-over'));
    th.addEventListener('drop', e => {
      e.preventDefault();
      th.classList.remove('drag-over');
      const destCol = parseInt(th.dataset.col);
      if (dragSrcCol === destCol) return;
      // participants配列を並び替え
      const moved = participants.splice(dragSrcCol, 1)[0];
      participants.splice(destCol, 0, moved);
      // draftDataも並び替え（順序はparticipants配列で管理しているので不要）
      saveState();
      buildRegTable();
      updateRegProgress();
    });
    hr.appendChild(th);
  });

  thead.appendChild(hr); table.appendChild(thead);
  const tbody = document.createElement('tbody');
  for (let i = 0; i < maxH; i++) {
    const tr = document.createElement('tr');
    const td0 = document.createElement('td'); td0.textContent = `${i+1}位`; tr.appendChild(td0);
    participants.forEach(p => {
      const td = document.createElement('td');
      const inp = document.createElement('input');
      inp.type = 'text'; inp.className = 'reg-input'; inp.maxLength = 30; inp.placeholder = '馬名';
      inp.value = draftData[p][i] || '';
      if (inp.value) inp.classList.add('filled');
      inp.addEventListener('input', () => {
        draftData[p][i] = inp.value.trim();
        inp.classList.toggle('filled', !!inp.value.trim());
        updateRegProgress(); saveState();
      });
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          const inputs = Array.from(document.querySelectorAll('.reg-input'));
          const idx = inputs.indexOf(inp);
          if (idx + 1 < inputs.length) inputs[idx + 1].focus();
        }
      });
      td.appendChild(inp); tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
}

let dragSrcCol = -1;

function updateRegProgress() {
  const total = participants.length * maxH;
  const filled = Object.values(draftData).flat().filter(x => x).length;
  document.getElementById('reg-count').textContent = filled;
  document.getElementById('reg-total').textContent = total;
  document.getElementById('draft-start-btn').disabled = filled === 0;
}

document.getElementById('draft-start-btn').addEventListener('click', () => {
  const empty = participants.some(p => draftData[p].some(h => !h));
  if (empty && !confirm('未入力の馬名があります。このままドラフトを開始しますか？')) return;
  revealedHorses = {}; revealedSet = {};
  participants.forEach(p => { revealedSet[p] = Array(maxH).fill(false); });
  showDraft();
});

function backToRegister() { showRegister(); }

// STEP3
function showDraft() {
  currentStep = 'draft';
  document.getElementById('register').style.display = 'none';
  document.getElementById('setup').style.display = 'none';
  document.getElementById('draft').style.display = 'block';
  buildDraftTable(); updateStats(); saveState();
}

function encodeId(str) { return str.replace(/[^a-zA-Z0-9]/g, c => '_' + c.charCodeAt(0) + '_'); }
function getDCard(p, i) { return document.getElementById(`dc_${encodeId(p)}_${i}`); }

function buildDraftTable() {
  const table = document.getElementById('draft-table'); table.innerHTML = '';
  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  const th0 = document.createElement('th'); th0.textContent = '順位'; hr.appendChild(th0);
  participants.forEach(p => { const th = document.createElement('th'); th.textContent = p; hr.appendChild(th); });
  thead.appendChild(hr); table.appendChild(thead);
  const tbody = document.createElement('tbody');
  for (let i = 0; i < maxH; i++) {
    const tr = document.createElement('tr');
    const td0 = document.createElement('td'); td0.textContent = `${i+1}位`; tr.appendChild(td0);
    participants.forEach(p => {
      const td = document.createElement('td');
      const card = document.createElement('div');
      card.className = 'card'; card.id = `dc_${encodeId(p)}_${i}`;
      const horse = draftData[p][i];
      if (!horse) {
        card.classList.add('empty'); card.textContent = '－';
      } else if (revealedSet[p] && revealedSet[p][i]) {
        const isDup = revealedHorses[horse] !== p;
        card.classList.add('revealed', isDup ? 'dup' : 'ok');
        card.innerHTML = `<span class="card-mark">${isDup ? '😇' : '🎯'}</span><span class="card-name">${horse}</span>`;
      } else {
        card.textContent = '🂠'; card.addEventListener('click', () => revealCard(p, i));
      }
      td.appendChild(card); tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
}

function revealCard(p, rank) {
  if (revealedSet[p][rank]) return;
  const horse = draftData[p][rank]; if (!horse) return;
  const isDup = revealedHorses[horse] !== undefined;
  if (!isDup) revealedHorses[horse] = p;
  revealedSet[p][rank] = true;
  const card = getDCard(p, rank);
  card.classList.add('revealed', isDup ? 'dup' : 'ok');
  card.innerHTML = `<span class="card-mark">${isDup ? '😇' : '🎯'}</span><span class="card-name">${horse}</span>`;
  updateStats(); saveState();
}

function updateStats() {
  const total = Object.values(draftData).flat().filter(x => x).length;
  const revealed = Object.values(revealedSet).flat().filter(Boolean).length;
  const wins = Object.keys(revealedHorses).length;
  const dups = revealed - wins;
  document.getElementById('stats').innerHTML =
    `<div class="stat">めくり済み　<b>${revealed} / ${total}</b></div>` +
    `<div class="stat ok-stat">🎯 当選　<b>${wins}</b></div>` +
    `<div class="stat dup-stat">😇 重複　<b>${dups}</b></div>`;
}

function resetAll() {
  if (!confirm('最初からやり直しますか？保存データもすべて消えます。')) return;
  clearSaved();
  participants = []; draftData = {}; revealedHorses = {}; revealedSet = {}; currentStep = 'setup';
  document.getElementById('draft').style.display = 'none';
  document.getElementById('register').style.display = 'none';
  document.getElementById('setup').style.display = 'block';
  renderTags();
}

// 画像保存
function saveImage() {
  const btn = document.getElementById('save-img-btn');
  btn.textContent = '生成中...'; btn.disabled = true;

  const table = document.getElementById('draft-table');
  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'background:#fbfbf9;padding:28px;display:inline-block;font-family:sans-serif;';

  const title = document.createElement('div');
  title.style.cssText = 'display:flex;align-items:center;gap:10px;margin-bottom:6px;';
  title.innerHTML = `<div style="width:28px;height:28px;background:#e60023;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:15px;">P</div><span style="font-size:20px;font-weight:700;color:#000;letter-spacing:-0.5px;">POG Draft 結果</span>`;
  wrapper.appendChild(title);

  const legend = document.createElement('div');
  legend.style.cssText = 'font-size:12px;color:#62625b;margin-bottom:14px;font-weight:600;';
  legend.textContent = '🎯 当選（他に指名なし）　😇 ハズレ（重複）';
  wrapper.appendChild(legend);

  const clone = table.cloneNode(true);
  clone.style.cssText = 'border-collapse:collapse;font-size:12px;color:#33332e;background:#ffffff;border-radius:16px;overflow:hidden;';
  clone.querySelectorAll('th').forEach(th => {
    th.style.cssText = 'background:#f6f6f3;color:#62625b;padding:10px 8px;border:1px solid #dadad3;text-align:center;white-space:nowrap;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;';
  });
  clone.querySelectorAll('td').forEach(td => {
    td.style.cssText = 'padding:5px 6px;border:1px solid #e5e5e0;text-align:center;vertical-align:middle;background:#ffffff;';
  });
  clone.querySelectorAll('td:first-child').forEach(td => {
    td.style.cssText = 'padding:5px 8px;border:1px solid #dadad3;background:#f6f6f3;color:#62625b;font-size:11px;font-weight:700;text-align:center;';
  });
  clone.querySelectorAll('.card').forEach(card => {
    let bg = '#f6f6f3', color = '#91918c', border = '#dadad3';
    if (card.classList.contains('ok'))  { bg = '#c7f0da'; color = '#103c25'; border = '#6cc49a'; }
    if (card.classList.contains('dup')) { bg = '#fce8e8'; color = '#9e0a0a'; border = '#e8a0a0'; }
    if (card.classList.contains('empty')) { bg = '#f6f6f3'; color = '#c8c8c1'; }
    card.style.cssText = `background:${bg};color:${color};border:1px solid ${border};border-radius:10px;padding:5px 4px;font-size:11px;font-weight:700;text-align:center;line-height:1.4;min-height:40px;display:flex;align-items:center;justify-content:center;flex-direction:column;`;
  });
  wrapper.appendChild(clone);
  document.body.appendChild(wrapper);

  import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.esm.js').then(mod => {
    mod.default(wrapper, { backgroundColor: '#fbfbf9', scale: 2, useCORS: true, logging: false })
    .then(canvas => {
      document.body.removeChild(wrapper);
      const link = document.createElement('a');
      link.download = 'pog_draft_result.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      btn.textContent = '📷 画像で保存'; btn.disabled = false;
    }).catch(() => { document.body.removeChild(wrapper); alert('画像の生成に失敗しました。'); btn.textContent = '📷 画像で保存'; btn.disabled = false; });
  }).catch(() => { document.body.removeChild(wrapper); alert('ライブラリの読み込みに失敗しました。'); btn.textContent = '📷 画像で保存'; btn.disabled = false; });
}
</script>
</body>
